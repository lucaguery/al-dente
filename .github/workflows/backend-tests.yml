name: backend-tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/check_rules_files_coverage.py"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main

concurrency:
  group: "backend-tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aldente_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL_TEST: "postgresql+psycopg2://postgres:postgres@localhost:5433/aldente_test"
      DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5433/aldente_test"
      GEMINI_API_KEY: test-key-not-used
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: test-key-not-used
      VAPID_PUBLIC_KEY: test-key
      VAPID_PRIVATE_KEY: test-key
      VAPID_EMAIL: test@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev
        working-directory: backend

      - name: Wait for Postgres
        run: |
          timeout 60 bash -c 'until pg_isready -h localhost -p 5433 -U postgres; do sleep 1; done'

      - name: Apply migrations
        run: uv run alembic upgrade head
        working-directory: backend

      - name: Seed
        run: uv run seed
        working-directory: backend

      - name: Run tests with coverage
        run: >-
          uv run pytest tests/
          --cov=app
          --cov-report=term
          --cov-report=json:coverage.json
          --cov-report=html:htmlcov
        working-directory: backend

      - name: Per-file rules-files coverage gate
        run: python scripts/check_rules_files_coverage.py backend/coverage.json

      - name: Upload coverage HTML artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-html
          path: backend/htmlcov

      - name: Upload coverage JSON artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-json
          path: backend/coverage.json
