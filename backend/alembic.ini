[alembic]
# Path to migration scripts (relative to this file).
script_location = alembic

# Prepend cwd to sys.path so ``from app.config import settings`` resolves in env.py.
prepend_sys_path = .

# Migration filename template — sequential numeric IDs (0001, 0002, ...).
file_template = %%(rev)s_%%(slug)s

# DB URL is injected from app.config.settings.database_url in env.py — leave blank.
sqlalchemy.url =

# Stamp migrations with UTC timestamps.
timezone = UTC


[post_write_hooks]
# No formatter hooks — keep migrations hand-edited.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
