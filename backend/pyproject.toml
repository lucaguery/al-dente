[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi[standard]>=0.136.1",
    "google-genai>=1.75",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-multipart>=0.0.27",
    "sqlalchemy>=2.0",
    "supabase>=2.0",
    "uvicorn[standard]>=0.46.0",
    "apscheduler>=3.11",
    "pywebpush>=2.3",
    "py-vapid>=1.9",
]

[project.scripts]
seed = "app.cli.seed:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
